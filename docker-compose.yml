services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: postgres:16-alpine
    container_name: ecommerce-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./apps/api/migrations:/migrations:ro
    command: >
      sh -c "
      set -e;
      psql postgresql://postgres:postgres@db:5432/ecommerce?sslmode=disable -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());';
      for file in /migrations/*.sql; do
        version=$$(basename $$file);
        applied=$$(psql postgresql://postgres:postgres@db:5432/ecommerce?sslmode=disable -tA -c \"SELECT 1 FROM schema_migrations WHERE version='$$version' LIMIT 1;\");
        if [ \"$$applied\" = \"1\" ]; then
          echo Skipping $$version;
          continue;
        fi;
        echo Applying $$version;
        psql postgresql://postgres:postgres@db:5432/ecommerce?sslmode=disable -v ON_ERROR_STOP=1 -f $$file;
        psql postgresql://postgres:postgres@db:5432/ecommerce?sslmode=disable -v ON_ERROR_STOP=1 -c \"INSERT INTO schema_migrations (version) VALUES ('$$version');\";
      done
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deployments/Dockerfile.api
    container_name: ecommerce-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ecommerce?sslmode=disable
      PORT: "8080"
      JWT_SECRET: dev-local-jwt-secret
      APP_ENV: development
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: deployments/Dockerfile.web
    container_name: ecommerce-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  db_data:
